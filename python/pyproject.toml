[project]
name = "svp402"
version = "0.0.0"
description = "x402 paying client for SVPChain (USDV/USDC) + LangChain/MCP agent tools"
requires-python = ">=3.10"
dependencies = ["eth-account>=0.12", "httpx>=0.27"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
mcp = ["mcp>=1,<2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["svp402*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
